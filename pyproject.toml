dependencies = [
    "pyspark>=3.4.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
    "mlflow>=2.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "azure-storage-file-datalake>=12.12.0",
    "azure-identity>=1.12.0",
    "azureml-core>=1.51.0",
    "azure-ai-ml>=1.9.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "claims_risk"
version = "0.1.0"
description = "Azure Claims Risk ML Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Azure Claims Risk Team" }]
